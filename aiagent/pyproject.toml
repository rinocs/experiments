[project]
name = "ai-rag-agent"
version = "0.5.0"
description = "Production-ready RAG agent con LangGraph, reranker, JWT auth, SSE streaming e Langfuse tracing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pypdf>=4.0",
    "streamlit>=1.35",
    "sentence-transformers>=3.0",
    "cohere>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "langfuse>=3.0",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
